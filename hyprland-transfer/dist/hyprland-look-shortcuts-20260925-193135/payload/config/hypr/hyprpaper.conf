# hyprpaper — https://wiki.hypr.land/Hypr-Ecosystem/hyprpaper/
#
# IMPORTANTE (hyprpaper 0.8): "wallpaper" es una categoría especial de hyprlang,
# así que ya no vale la línea antigua "wallpaper = ,/ruta.jpg". Esa forma se
# ignora en silencio (no da error, simplemente no se lee) y hyprpaper arranca
# SIN fondo: el escritorio muestra entonces el fondo propio de Hyprland y parece
# que los fondos no se activan. La forma que sí funciona es la de abajo.
#
# Este fondo es solo el de arranque: wallpaper-rotator.sh aplica enseguida una
# imagen al azar de la carpeta, así que esto únicamente se ve si el rotador no
# llega a arrancar.
ipc = on

# Sin el texto de bienvenida de Hyprland superpuesto al fondo.
splash = false

wallpaper {
    # * = todos los monitores. Con el nombre exacto (eDP-1) también vale, pero
    # obliga a editarlo si cambia el nombre de la salida.
    monitor = *
    path = __WALLPAPER_DIR__/grey_lain_wallpaper.jpg
    fit_mode = cover
}
