#!/bin/bash

# Ruta de tu carpeta de fondos
DIR="/home/pedro/Imágenes/wallpapers"

# Intervalo en segundos (20 minutos = 1200 segundos)
INTERVAL=1200

while true; do
    # Busca todas las imágenes en la carpeta y las mezcla aleatoriamente
    find "$DIR" -type f \( -name "*.jpg" -o -name "*.jpeg" -o -name "*.png" \) | shuf | while read -r img; do
        
        # 1. Cargar la imagen en la memoria de Hyprpaper
        hyprctl hyprpaper preload "$img"
        
        # 2. Establecer la imagen en todos los monitores (la coma sin nombre de monitor aplica a todos)
        hyprctl hyprpaper wallpaper ",$img"
        
        # 3. Esperar 20 minutos
        sleep $INTERVAL
        
        # 4. Descargar la imagen antigua de la RAM para que no consuma memoria
        hyprctl hyprpaper unload "$img"
        
    done
done
